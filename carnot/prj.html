<body>
    <h1>卡诺热机余热发电方案</h1>
    <h3>&emsp;saintthor@gmail.com</h3>
    <div style="display:none">
        <div>
            <button type="button" onclick="addTag('b')">B</button>
            <button type="button" onclick="addTag('i')">I</button>
            <button type="button" onclick="addTag('u')">U</button>
            <button type="button" onclick="addTag('toggle')">Toggle</button>
             <button type="button" onclick="addTag('r')">r</button>
        </div>
        <textarea id="input">[toggle=on][title]热源[/title][content]400℃/150℃ 两种温度，天然气燃烧烟气，常压，可排放。[/content][/toggle]
    
    [toggle=on][title]目标[/title][content]发电功率 1kw 的热机。[/content][/toggle]
    
    [toggle=on][title]基本方案[/title][content]采用环管动能式（[url=index.html]第四动画[/url]）。
    
    [toggle=on][title]热机结构[/title][content]如图 1，对第四动画中的直管部分作了细化，使之具备热交换功能。[div=|float=right|width=360px][div=|position=absolute|border=0px]图 1[/div][pic=pic/0.png]
    [div=|position=absolute|border=0px]图 2[/div][pic=pic/6.png][/div]

以下方直管为例，添加了[b]冷腔[/b]（左多刺圆柱）和[b]换热器[/b]（右长方体）。由于添加后变成折线形，以下改称为[b]折管[/b]。图 1 为阀门切换之前的状态。对照动画看，环形管持续逆时针旋转，下方折管的左侧阀门开（绿色为通，红色为断），水柱将工质气体压入冷腔。这是[b]等温压缩[/b]过程，气体在冷腔释放热量。

接着阀门切换，下折管和环管所有阀门开关状态翻转。同时开启[b]热源阀门[/b]，使热源气体进入换热器。下折管开口变为右侧，冷腔中的工质气体经换热器加热后流入环管。这是[b]降压升温膨胀[/b]过程，处于等压膨胀和等温膨胀之间。换热器上两根红色管为热源气体的通路：上方为排气口，热源气体降温后排入大气；下方为进气口，从圆心连接热源供气管。如图 2，热源气体由管道沿旋转中轴接入，经过一个[b]旋转接头[/b]进入热机圆心处，分成两路接入两个折管，各带一个[b]热源阀门[/b]。因此图 1 中换热器的热源进气口连接到圆心。在换热器中，热源气体和工质气体流动方向相反。

转过一段之后（约 90°），切断换热器的热源阀门。环管中的存量工质气体[b]绝热膨胀[/b]降温。这时冷腔里的低温气体进入环管，可能造成熵增，影响不大。

转过半圈之后，工质气体降到冷腔温度，再次切换阀门。下折管（现在已经转到上方）的冷腔侧阀门（原左侧，现在转到右侧）开启，环管中的工质气体压入冷腔并在冷腔放热，为[b]等温压缩[/b]过程。再转半圈恢复到初始状态。

工质气体的循环方式为：降压升温膨胀（换热器）-绝热膨胀-等温压缩。不是卡诺循环。对于 400℃ 高温热源气体，卡诺循环的效率大于 1/2，本设计的理论效率约为 29%。对于 150℃ 低温热源气体，卡诺循环超过 1/5，本设计约为 1/10。差距在于卡诺循环完全从高温点吸热，吸不到高温点以下的热量，而本设计从换热器吸热，换热器里的吸热温度从高温一路降到低温，平均温度更低。只有用换热器才能最大限度地提取热源气体中的热量。若用卡诺循环，全程在高温吸热，则热源气体只是略有降温，绝大部分余热仍待回收。

上方的直管也要作同样的改造，形状与下折管中心对称。

[toggle=on][title]部件[/title][content]包括：[b]环形管[/b]及[b]两个阀门[/b]；[b]折管[/b]（[b]冷腔[/b]、[b]换热器[/b]、[b]热源气体管[/b]、左右[b]折管阀门[/b]、[b]热源阀门[/b]）* 2；[b]旋转接头[/b]。
    控制系统：[b]单片机[/b]，能控制阀门切换，收集各传感器实时数据并传输出来；[b]温度传感器[/b]、[b]气压传感器[/b]、[b]水柱位置传感器[/b]、[b]旋转角度传感器[/b]、[toggle=off][title]氢气传感器[/title][content]若水柱传感器会向水中释放电流，将产生微量氢气。积累过多有爆炸风险，须检测清除。[/content][/toggle]。
    冷腔内、外，折管内各段应加温度传感器和气压传感器。
    在环管中，从外侧靠近折管处（外侧是远离另一根折管的方向）应加水柱位置传感器，检测当前位置是否有水。
    [/content][/toggle]
[/content][/toggle]

    [toggle=on][title]规格[/title][content]环形管：环直径 3m，（环）管内直径 20cm。
    折管内直径 4cm。
    水柱长 4m，重约 100kg。
    转速为 3 秒一圈。
    最高气压/最低气压 = 9。暂定高压为 3atm。
    工质气体要用[b]单原子气体[/b]。用氦气少于 50g。调试时可先用空气，保证整体能正常运行；再用氩气，保证热力学指标正常；如转速不够再改氦气，提高功率。氩气价格为同摩尔氦气的 1/50。
    单片机采样传感器的数值，频率不低于 20 次/秒。通过 wifi 将数据传出。
    功率与水柱质量及旋转线速度成正比。可以先做小尺寸模型，跑通后再放大。在同样角速度下，功率正比于环直径的平方，也正比于（环）管直径的平方。试制时环管最好先用透明材料。
    [/content][/toggle]
    [/content][/toggle]

    [toggle=on][title]开发路线图[/title][content]先考虑适用高温热源气（400℃）的热机。当前为预研阶段，重点研究下述技术：

    [toggle=on][title]1、环管阀门[/title][content]共需要 8 个阀门。[div=|float=right][div=|position=absolute|border=0px]图 3[/div][pic=pic/3.png][/div]
    环管上的两个阀门是重点。因为环管较粗，而且环管要走水，阀门开启时不能挡住水流，所以不能用圆锥阀门。每个阀门从收到控制信号到完成切换的时间应在 0.1 秒之内，反应太慢会影响转速和功率。

    可以[b]利用气压推动环管阀门切换[/b]，电只用于触发。

    图 3 是切换前的状态：水柱已经（顺时针）通过了右环管阀门和附近的直管口，环管阀门待关闭时（右绿），在水柱一侧的直管（下）为高压区，无水柱一侧的环管与直管（上）是低压区。对于待开启的环管阀门（左红），阀门两侧在水柱一侧（下）为高压，另一侧（上）为低压。高低压相差至少 2atm，能提供足够的动力。

    在切换过程中，两个环管阀门可以短暂地同时关闭，不能同时开启。要先关闭原开启者，再开启原关闭者。

    由水柱传感器获知，在水柱通过一个环管阀门及附近直管口（下直管右口）之后开始切换，在水柱到达对面环管阀门附近的直管口（下直管左口）之前完成。

    整个切换过程的顺序为：
    1、关闭原开启的环管阀门（右）。
    2、开启水柱侧折管的热源气体阀门。此步骤可前移。
    3、切换水柱侧折管两端的阀门。
    4、切换非水柱侧折管两端的阀门。此步骤可前移到任意位置，在 5 之前完成即可。
    5、开启原关闭的环管阀门（左）。

    由电信号触发第一步后，后续步骤可以用机械传动完成。

    水柱侧折管的热源气体阀门在下次切换之前的某一时间关闭，大概在水柱走过 90° 后关闭，具体位置要通过实验确定。根据传感器数据可作微调。
    [/content][/toggle]

    [toggle=on][title]2、冷腔[/title][content]冷腔是决定本设计功率的关键，要具备高导热能力，在快速压缩过程中不大幅升温，与环境的温差低于 20℃。对于高温（400℃）热源气，表面积要大（参考值 3 平方米），而容积应不超过 15 升。典型的实现是直径 1.42m 的薄圆盘，内部厚为 1cm。如果圆盘过大不容易制造，可改成两个直径 1m 的。
    
    必须在内外加上翅片：用许多铝薄片（翅片）在内部连接两个圆面。翅片之间不相连，以免阻碍气流。所有翅片在圆面上的投影约占 2% 的面积。由于外部也需要翅片，可以令内部翅片穿过圆面延伸到外面。
    
    翅片也用于对抗气压造成的圆盘变形。应耐压 5 atm。
    
    冷腔外表面用喷水或喷雾降温。喷雾为喷洒少量细水珠，令水蒸发吸热，用水量更少。
    
    如果压缩过程中，环管内部出现明显升温，需要把每半边环管的后半段改成导热材料，并在内部加少量翅片。
    
    使用低温（150℃）热源气的版本需要更大面积（放热量高 50%），容积也可以大些（近五倍）。
    
    冷腔外壁要薄，表面涂成黑色。不能被太阳直射，可以淋雨。
    
    冷腔里可能有少量冷凝水，要考虑排水功能。
    [/content][/toggle]

    [toggle=on][title]3、换热器[/title][content]理想换热器能让相向通过的两种气体的温度对换，高温的变成低温，低温的变成高温。实际的温度比理想值偏差在 20℃ 以内即可。
    在环形管中部有足够的空间，能安装长达 2m 的换热器。主要的难点是热源气体的压强较低，通过换热器速度可能较慢。热源气体入口流速要达到 60 升/秒（每一周期约一半时间通气）。工质气体的流速要 120 升/秒。
    若热源气体流速不够，可在热源气体通入热机的[b]旋转接头[/b]上装一个[b]增压风扇[/b]。可能需要同轴变速器。
    [/content][/toggle]

[toggle=on][title]4、旋转接头[/title][content]用在热源气体通入热机处。热源气体管道沿中轴通入环形管的圆心，热机上的一段管随热机旋转，要用旋转接头与外管连接。总体要求是阻力小、不漏气。由于热源气体是常压，气密性要求不高，应该不是难点。
如前述，若热源气体流速不够，可加装[b]增压风扇[/b]。
[/content][/toggle]
[/content][/toggle]
        </textarea>
        <br>
        <button onclick="generate()">Generate</button>
    </div><br>
    <div id="output" class="output"></div>

    <script>
        const ubb = new UBB();

        function generate() {
            const input = document.getElementById('input').value;
            const output = ubb.express(input);
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = output;
            ubb.awake(outputDiv);
        }

        function addTag(tag) {
            const textarea = document.getElementById('input');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const selectedText = textarea.value.substring(start, end);
            let replacement;

            if (tag === 'toggle') {
                replacement = `[toggle=off][title]${selectedText || 'TITLE'}[/title][content]CONTENT[/content][/toggle]`;
                 textarea.value = textarea.value.substring(0, start) + replacement + textarea.value.substring(end);
                const contentStart = textarea.value.indexOf('CONTENT', start);
                textarea.focus();
                textarea.setSelectionRange(contentStart, contentStart + 'CONTENT'.length);

            } else {
                 replacement = `[${tag}]${selectedText}[/${tag}]`;
                 textarea.value = textarea.value.substring(0, start) + replacement + textarea.value.substring(end);
                 textarea.focus();
                 if (!selectedText) {
                    const cursorPosition = start + tag.length + 2;
                    textarea.setSelectionRange(cursorPosition, cursorPosition);
                 } else {
                    textarea.setSelectionRange(start, start + replacement.length);
                 }
            }
        }

        window.onload = generate;
    </script>

</body>
</html>
