<!DOCTYPE html>
<html>
<head>
    <title>卡诺热机余热发电方案</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="ubb.css">
    <script src="NewUBB.js"></script>
    <style>
        body { font-family: sans-serif; }
        textarea { width: 100%; height: 250px; }
        .output { border: 1px solid #ccc; padding: 10px; min-height: 50px; }
    </style>
</head>
<body>
    <h1>卡诺热机余热发电方案</h1>
    <div style="display:none">
        <div>
            <button type="button" onclick="addTag('b')">B</button>
            <button type="button" onclick="addTag('i')">I</button>
            <button type="button" onclick="addTag('u')">U</button>
            <button type="button" onclick="addTag('toggle')">Toggle</button>
             <button type="button" onclick="addTag('r')">r</button>
        </div>
        <textarea id="input">[toggle=on][title]热源[/title][content]400℃/150℃ 两种温度，天然气燃烧烟气，常压，可排放。
    [/content][/toggle]
    [toggle=on][title]目标[/title][content]发电功率 1kw 的热机。
    [/content][/toggle]
    [toggle=on][title]基本方案[/title][content]采用环管动能式（[url=index.html]第四动画[/url]）。
    [toggle=on][title]热机结构[/title][content]如右图。[url=ring.html]在此可看动画[/url][div=|float=right][pic=pic/1.png][/div]
    包括：[b]环形管[/b]及[b]两个阀门[/b]；[b]直管[/b] * 2 及[b]四个阀门[/b]；[b]热腔[/b]；[b]冷腔[/b]；直管分别通向热、冷腔的 Y 形 [b]导热管[/b] * 4 及[b]四个阀门[/b]；冷腔到热腔的[b]回气管[/b]及[b]单向阀[/b]。
    右图中前面红色圆盘为热腔，后面蓝色圆盘是冷腔，两者与环管一体旋转。两根直管与热腔接通时可以吸热，与冷腔接通时可以放热。
    回气管在右图中未画，见下图中的虚线管。[b]回气管也从旋转轴里走[/b]，与导热管并行，将冷腔的气体导回热腔。若无回气管，热机将不断从热腔吸气并向冷腔压气，运行不可持续。回气管上加单向阀，保证气体只能从冷腔流向热腔。
    工质气体的循环方向为：热腔-导热管-直管-环管-另一直管-导热管-冷腔-回气管-热腔。
    [div=|width=360px][pic=pic/2.png][/div]
    控制系统：[b]单片机[/b]，能控制阀门切换，收集各传感器实时数据并传输出来；[b]温度传感器[/b]、[b]气压传感器[/b]、[b]水柱位置传感器[/b]、[toggle=off][title]氢气传感器[/title][content]若水柱传感器会向水中释放电流，将产生微量氢气。积累过多有爆炸风险，须检测清除。[/content][/toggle]。
    热腔、冷腔和直管内应加温度传感器和气压传感器。这些传感器在定型后有助于排查故障。
    在环管中，从外侧靠近直管处（外侧是远离另一根直管的方向）应加水柱位置传感器，检测当前位置是否有水。这种传感器不能缺少，要依赖它判断切换阀门的时间。
    单片机采样传感器的数值，频率不低于 10 次/秒。通过 wifi 将数据传出。
    [/content][/toggle]
    [toggle=on][title]规格[/title][content]环形管：环直径 3m，管内径 20cm。
    回气管内径 5cm。
    其它管内径 4cm。
    水柱长 4m，重约 100kg。
    转速为 3 秒一圈。
    最高气压 6atm，最低气压 1atm。
    工质气体要用[b]单原子气体[/b]。用氦气少于 300g，几十元。调试时可先用空气，再用氩气，氩气价格为同摩尔氦气的 1/50。
    功率与水柱质量及旋转线速度成正比。可以先做小尺寸模型，跑通后再放大。试制时环管最好先用透明材料。
    [/content][/toggle]
    [/content][/toggle]

    [toggle=on][title]路线图[/title][content]先考虑适用高温热源气的热机。当前为预研阶段，重点研究下述技术：
    [toggle=on][title]电控阀门[/title][content]共需要 10 个。[div=|float=right][pic=pic/3.png][/div]
    环管上的两个阀门是重点。因为环管较粗，而且环管要走水，阀门开启时不能挡住水流，所以不能用圆锥阀门。每个阀门从收到控制信号到完成切换的时间应在 0.1 秒之内，反应太慢会影响转速和功率。
    [b]可以利用气压推动环管阀门切换[/b]，电只用于触发。
    右图是切换前的状态：水柱已经（顺时针）通过环管阀门和附近的直管口，环管阀门待关闭时（右绿），在水柱一侧的直管（下）为高压区，无水柱一侧的环管与直管（上）是低压区。对于待开启的环管阀门（左红），阀门两侧在水柱一侧（下）为高压，另一侧（上）为低压。高低压相差 4atm 左右，能提供足够的动力。
    在切换过程中，两个环管阀门可以短暂地同时关闭，不能同时开启。要先关闭原开启者，再开启原关闭者。
    由水柱传感器获知，在水柱通过一个环管阀门及附近直管口（下直管右口）之后开始切换，在水柱到达对面环管阀门附近的直管口（下直管左口）之前完成。
    整个切换过程的顺序为：
    1、关闭原开启的环管阀门（右）。
    2、开启原关闭的两个直管阀门（右）。
    3、关闭原开启的两个直管阀门（左）。
    4、开启原关闭的环管阀门（左）。
    5、开启两直管通向热／冷腔的阀门（图中未画），令水柱侧直管（下）接通热腔，另一直管（上）接通冷腔。
    由电信号触发第一步后，后续步骤可以用机械传动完成。

    两直管通向热／冷腔的阀门在下次切换之前的某一时间关闭，具体位置要通过实验确定。热腔导热管阀门大概在水柱走过 60° 后关闭。冷腔阀导热管门大概在水柱走过 120° 后关闭。根据温度、气压传感器数据可作微调。
    [/content][/toggle]
    
    [toggle=on][title]热腔[/title][content]如右图：热源气体管为 L 形。热腔在热源气体管的水平段内。中轴穿入热源气体管与热腔相连，热腔随环管旋转。[div=|float=right|width=400px][pic=pic/5.png][/div]
    热腔不是简单容器，而是换热器（可以是一段螺旋管）。换热器的冷端在热源气体的出气方向，冷端连接由冷腔过来的回气管，回气管的冷气从这里进入热腔。换热器的热端在热源气体的入气方向，热端连接导热管，热气从这里离开热腔，进入直管和环形管。
    对于高温（400℃）热源气，换热器的表面积应为 10 平方米。低温（150℃）热源气需要更大面积，具体数值要根据高温热机的运行数据计算。
    热源气体经过换热器后，大部分热量被吸收，温度应降低到接近冷腔。
    换热器两端连接的回气管和导热管都从中轴里通过，不影响旋转。中轴内两管之间要做好隔热。
    [/content][/toggle]
    [toggle=on][title]冷腔[/title][content]冷腔无须做成换热器，做成圆盘形即可。内部可以加一些垂直于中轴的有孔隔板，令由导热管进来的气体经充分散热后才到达最远端。最远端是回气管的入口，气体到这里时应冷却到最低温，通过回气管回到热腔。
    对于高温（400℃）热源气，冷腔的表面积应也应为 10 平方米。直径 2.5m 的圆盘两个表面就差不多。低温（150℃）热源气需要更大面积。可在外表面加翅片或风扇加强散热。
    冷腔不能被太阳直射，可以淋雨。
    [/content][/toggle]
    其它都是常规要求：轴承阻力要小。热腔导热管、热腔侧回气管、环管和直管做好隔热。整体长度（冷腔到热腔）要短。两直管在环管上的连接点要尽量靠近。冷、热腔外壁要薄，表面涂成黑色。
    [/content][/toggle]
        </textarea>
        <br>
        <button onclick="generate()">Generate</button>

    </div>
    <div id="output" class="output"></div>

    <script>
        const ubb = new UBB();

        function generate() {
            const input = document.getElementById('input').value;
            const output = ubb.express(input);
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = output;
            ubb.awake(outputDiv);
        }

        function addTag(tag) {
            const textarea = document.getElementById('input');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const selectedText = textarea.value.substring(start, end);
            let replacement;

            if (tag === 'toggle') {
                replacement = `[toggle=off][title]${selectedText || 'TITLE'}[/title][content]CONTENT[/content][/toggle]`;
                 textarea.value = textarea.value.substring(0, start) + replacement + textarea.value.substring(end);
                const contentStart = textarea.value.indexOf('CONTENT', start);
                textarea.focus();
                textarea.setSelectionRange(contentStart, contentStart + 'CONTENT'.length);

            } else {
                 replacement = `[${tag}]${selectedText}[/${tag}]`;
                 textarea.value = textarea.value.substring(0, start) + replacement + textarea.value.substring(end);
                 textarea.focus();
                 if (!selectedText) {
                    const cursorPosition = start + tag.length + 2;
                    textarea.setSelectionRange(cursorPosition, cursorPosition);
                 } else {
                    textarea.setSelectionRange(start, start + replacement.length);
                 }
            }
        }

        window.onload = generate;
    </script>

</body>
</html>
